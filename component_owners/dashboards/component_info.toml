has_support_component = true
members_required = 3
tier = 1
product_managers = ["mathieu.sobrero@checkmk.com"]
description = """
Everything a user sees and does on dashboards, Checkmk's customizable overview pages.

Belongs here:
- Built-in dashboards (Main dashboard, Linux hosts, ...) and user-created custom
  dashboards
- Creating, cloning and editing dashboards: layout, widget configuration,
  filters/context, visibility and sharing settings
- All widget types (embedded views, graphs, bar charts, gauges, site overview,
  static text, ...) — a widget not rendering, showing wrong content or ignoring
  its filters
- Managing dashboards through the REST API

Goes elsewhere:
- The displayed metric data itself is wrong, i.e. the same graph is also wrong on
  the service's own graph page → Performance Data & Metrics
- The graph does not render or refresh outside a dashboard either → Graphs
- The same view/table is also broken outside a dashboard → UI - Monitoring
"""
