<text x="198" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Fetcher</text>
<text x="198" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">worker</text>
</g>
<g>
<rect x="268" y="72" width="104" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2">
