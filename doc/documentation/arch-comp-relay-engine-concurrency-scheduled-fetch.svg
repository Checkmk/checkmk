</line>
<line x1="564" x2="564" y1="120" y2="456" stroke="#d1d5db" stroke-width="1.25" stroke-dasharray="4 4">
</line>
<line x1="684" x2="684" y1="120" y2="456" stroke="#d1d5db" stroke-width="1.25" stroke-dasharray="4 4">
