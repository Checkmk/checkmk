<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 760 480" role="img" aria-label="A scheduled fetch passes through queues, so the main loop never waits" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
