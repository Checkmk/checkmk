</defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#111827">A scheduled fetch passes through queues, so the main loop never waits</text>
<text x="24" y="54" font-size="11.5" fill="#4b5563">One FetchTask from scheduling to the site; numbers give the order</text>
<g>
