<text x="76" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">process</text>
</g>
<g>
<rect x="146" y="72" width="104" height="48" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25">
