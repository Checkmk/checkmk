<svg xmlns="http://www.w3.org/2000/svg" width="760" height="576" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 760 576" role="img" aria-label="The relay polls the site for work and pushes raw results back to the core" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="g-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><marker id="g-arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="g-arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="g-arrow-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker></defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#111827">The relay polls the site for work and pushes raw results back to the core</text>
<text x="24" y="54" font-size="11.5" fill="#4b5563">Who talks to whom; every arrow between site and relay is an HTTPS request the relay makes</text>
<rect x="24" y="72" width="456" height="408" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="40" y="96" font-weight="600" fill="#111827">Checkmk site</text>
<rect x="528" y="72" width="208" height="408" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="544" y="96" font-weight="600" fill="#111827">Relay</text>
<g fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M220 148H268" marker-end="url(#g-arrow)"/><path d="M130 184V224" marker-end="url(#g-arrow)"/><path d="M130 328V368" marker-end="url(#g-arrow)"/><path d="M632 328V368" marker-start="url(#g-arrow)" marker-end="url(#g-arrow)"/><path d="M632 456V504" marker-end="url(#g-arrow)"/></g>
<g fill="none" stroke="#ea580c" stroke-width="1.5"><path d="M366 184V224" marker-end="url(#g-arrow-1)"/><path d="M464 240H544" marker-end="url(#g-arrow-1)"/><path d="M632 224V184" marker-end="url(#g-arrow-1)"/></g>
<g fill="none" stroke="#2563eb" stroke-width="1.5"><path d="M544 276H464" marker-end="url(#g-arrow-2)"/><path d="M268 276H220" marker-end="url(#g-arrow-2)"/></g>
<g fill="none" stroke="#059669" stroke-width="1.5"><path d="M220 412H268" marker-start="url(#g-arrow-3)" marker-end="url(#g-arrow-3)"/><path d="M464 312H544" marker-start="url(#g-arrow-3)" marker-end="url(#g-arrow-3)"/></g>
<g><rect x="40" y="112" width="180" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="130" y="136" text-anchor="middle" font-weight="600" fill="#111827">GUI</text><text x="130" y="152" text-anchor="middle" font-size="11.5" fill="#111827">Setup, discovery page,</text><text x="130" y="168" text-anchor="middle" font-size="11.5" fill="#111827">Reschedule check</text></g>
<g><rect x="268" y="112" width="196" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="366" y="136" text-anchor="middle" font-weight="600" fill="#111827">Activation</text><text x="366" y="152" text-anchor="middle" font-size="11.5" fill="#111827">core config, plus one</text><text x="366" y="168" text-anchor="middle" font-size="11.5" fill="#111827">directory per relay</text></g>
<g><rect x="40" y="224" width="180" height="104" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="130" y="248" text-anchor="middle" font-weight="600" fill="#111827">CMC core</text><text x="130" y="264" text-anchor="middle" font-size="11.5" fill="#111827">schedules site-side</text><text x="130" y="280" text-anchor="middle" font-size="11.5" fill="#111827">services; its checker</text><text x="130" y="296" text-anchor="middle" font-size="11.5" fill="#111827">helpers evaluate relay</text><text x="130" y="312" text-anchor="middle" font-size="11.5" fill="#111827">results</text></g>
<g><rect x="40" y="368" width="180" height="88" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="130" y="392" text-anchor="middle" font-weight="600" fill="#111827">Ad-hoc callers</text><text x="130" y="408" text-anchor="middle" font-size="11.5" fill="#111827">forced checks, cmk_inv,</text><text x="130" y="424" text-anchor="middle" font-size="11.5" fill="#111827">discovery automations,</text><text x="130" y="440" text-anchor="middle" font-size="11.5" fill="#111827">check_on_relay</text></g>
<g><rect x="268" y="224" width="196" height="232" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="366" y="248" text-anchor="middle" font-weight="600" fill="#111827">Agent receiver</text><text x="366" y="264" text-anchor="middle" font-size="11.5" fill="#111827">relay API, HTTPS + mTLS</text><text x="366" y="280" text-anchor="middle" font-size="11.5" fill="#111827">task store in memory,</text><text x="366" y="296" text-anchor="middle" font-size="11.5" fill="#111827">tasks expire after 120 s</text><text x="366" y="328" text-anchor="middle" font-size="11.5" fill="#111827">results go to the CMC's</text><text x="366" y="344" text-anchor="middle" font-size="11.5" fill="#111827">raw-data socket</text></g>
<g><rect x="544" y="112" width="176" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="632" y="136" text-anchor="middle" font-weight="600" fill="#111827">Unpacked config</text><text x="632" y="152" text-anchor="middle" font-size="11.5" fill="#111827">helper_config/&lt;serial&gt;</text><text x="632" y="168" text-anchor="middle" font-size="11.5" fill="#111827">and a latest link</text></g>
<g><rect x="544" y="224" width="176" height="104" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="632" y="248" text-anchor="middle" font-weight="600" fill="#111827">cmk-relay daemon</text><text x="632" y="264" text-anchor="middle" font-size="11.5" fill="#111827">polls tasks every 0.5 s</text><text x="632" y="280" text-anchor="middle" font-size="11.5" fill="#111827">and schedules its</text><text x="632" y="296" text-anchor="middle" font-size="11.5" fill="#111827">hosts' services</text></g>
<g><rect x="544" y="368" width="176" height="88" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="632" y="392" text-anchor="middle" font-weight="600" fill="#111827">Helper processes</text><text x="632" y="408" text-anchor="middle" font-size="11.5" fill="#111827">fetcher, fetch-ad-hoc,</text><text x="632" y="424" text-anchor="middle" font-size="11.5" fill="#111827">checkhelper; they fork</text><text x="632" y="440" text-anchor="middle" font-size="11.5" fill="#111827">agents and checks</text></g>
<g><rect x="528" y="504" width="208" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="632" y="524" text-anchor="middle" font-weight="600" fill="#111827">Monitored hosts</text><text x="632" y="540" text-anchor="middle" font-size="11.5" fill="#111827">agents, SNMP, APIs, ICMP</text></g>
<g><circle cx="380" cy="204" r="8" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1.25"/><text x="380" y="208" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">1</text><circle cx="504" cy="226" r="8" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1.25"/><text x="504" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">1</text><circle cx="646" cy="204" r="8" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1.25"/><text x="646" y="208" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">1</text><circle cx="504" cy="264" r="8" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1.25"/><text x="504" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">2</text><circle cx="244" cy="264" r="8" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1.25"/><text x="244" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">2</text><circle cx="504" cy="300" r="8" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="1.25"/><text x="504" y="304" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">3</text><circle cx="244" cy="400" r="8" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="1.25"/><text x="244" y="404" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">3</text></g>
<g><circle cx="32" cy="520" r="8" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1.25"/><text x="32" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">1</text><text x="46" y="524" font-size="11.5" fill="#111827">configuration</text><circle cx="160" cy="520" r="8" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1.25"/><text x="160" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">2</text><text x="174" y="524" font-size="11.5" fill="#111827">scheduled checks</text><circle cx="310" cy="520" r="8" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="1.25"/><text x="310" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">3</text><text x="324" y="524" font-size="11.5" fill="#111827">ad-hoc tasks</text><text x="24" y="552" font-size="11.5" fill="#4b5563">Gray arrows stay inside one machine.</text></g>
</svg>
