<g fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M320 156H198" marker-end="url(#sch-arrow)"/><path d="M198 196H76" marker-end="url(#sch-arrow)"/><path d="M76 236H198" marker-end="url(#sch-arrow)"/><path d="M198 276H320" marker-end="url(#sch-arrow)"/><path d="M320 316H442" marker-end="url(#sch-arrow)"/><path d="M442 356H564" marker-end="url(#sch-arrow)"/><path d="M564 396H684" stroke-dasharray="5 4" marker-end="url(#sch-arrow)"/><path d="M684 436H564" stroke-dasharray="5 4" marker-end="url(#sch-arrow)"/></g>
<text x="259" y="148" text-anchor="middle" font-size="11.5" fill="#111827">1, due service</text>
<text x="137" y="188" text-anchor="middle" font-size="11.5" fill="#111827">2, fetch or check</text>
<text x="137" y="228" text-anchor="middle" font-size="11.5" fill="#111827">3, raw data</text>
<text x="259" y="268" text-anchor="middle" font-size="11.5" fill="#111827">4, result</text>
<text x="381" y="308" text-anchor="middle" font-size="11.5" fill="#111827">5, POST /monitoring</text>
<text x="503" y="348" text-anchor="middle" font-size="11.5" fill="#111827">6, raw-data socket</text>
<text x="624" y="388" text-anchor="middle" font-size="11.5" fill="#111827">7, evaluate</text>
<text x="624" y="428" text-anchor="middle" font-size="11.5" fill="#111827">8, service states</text>
<text x="24" y="480" font-size="11.5" fill="#4b5563">Dashed steps run for fetcher payloads only; an active check result is final when it reaches the CMC.</text>
