<g><rect x="24" y="72" width="104" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="76" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Monitored</text><text x="76" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">host</text></g>
<g><rect x="146" y="72" width="104" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="198" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Relay</text><text x="198" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">helper</text></g>
<g><rect x="268" y="72" width="104" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="320" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">cmk-relay</text><text x="320" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">daemon</text></g>
<g><rect x="390" y="72" width="104" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="442" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Agent</text><text x="442" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">receiver</text></g>
