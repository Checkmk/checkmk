<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 760 496" role="img" aria-label="A scheduled result is pushed once and evaluated on the site" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
