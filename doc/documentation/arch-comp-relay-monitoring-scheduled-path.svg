<text x="24" y="34" font-size="15" font-weight="600" fill="#111827">A scheduled result is pushed once and evaluated on the site</text>
<text x="24" y="54" font-size="11.5" fill="#4b5563">Check_MK, Check_MK Discovery and active checks of a relay host</text>
