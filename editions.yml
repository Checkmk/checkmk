# The common set of distros which gets build during an official release
# ubuntu-22.04 is still built, but internal only, see internal_distros
common: &common
    - "debian-12"
    - "debian-13"
    - "ubuntu-22.04"
    - "ubuntu-24.04"
    - "ubuntu-26.04"
    - "almalinux-8"
    - "almalinux-9"
    - "almalinux-10"
    - "sles-15sp7"
    - "sles-16.0"

# A reduced set of distros for the daily builds
# Containing only the latest version of each supported OS
# ubuntu-24.04 is used as base of the Docker image
daily_reduced: &daily_reduced
    - "almalinux-10"
    - "debian-13"
    - "ubuntu-22.04"
    - "ubuntu-24.04"
    - "ubuntu-26.04"
    - "sles-16.0"

daily_saas: &daily_saas
    - "ubuntu-22.04"
    - "ubuntu-24.04"

# Builds for those distros will only be available internally for development purpose
# ubuntu-22.04: CI jobs still run on it, to be removed with CMK-35236
internal_distros: &internal_distros
    - "ubuntu-22.04"

# Currently, all builds of the cloud (formerly saas) edition should stay completley internal
internal_editions:
    - "cloud"

cma_distros: &cma_distros
    - "cma-4"

# ubuntu-22.04 is internal only, it stays until FIPS testing moves to RHEL 9
# (CMK-40529 to CMK-40533)
fips_distros: &fips_distros
    - "ubuntu-22.04"

# README:
# - the following sections defines what will be build/tested under which "use-case"
# - as a consequence, you need to consider e.g.:
#   - if we want to test the update for the combination edition A / distro B,
#     we may also need the builds for that!
#   - so keep that in mind when changing those settings!
editions:
    pro:
        release: [*common, *cma_distros]
        daily: *daily_reduced
        daily_tests: *daily_reduced
        fips: [*fips_distros]
        # Don't test the update process for internal distros, they are not public anyway
        # TODO: switch back to *daily_reduced once ubuntu-22.04 is gone (CMK-35236)
        daily_update_tests:
            - "almalinux-10"
            - "debian-13"
            - "ubuntu-24.04"
            - "ubuntu-26.04"
            - "sles-16.0"
        weekly: [*common, *cma_distros]
        testbuild: ["ubuntu-24.04", "sles-16.0", "cma-4"]
    ultimate:
        release: [*common, *cma_distros]
        daily: *daily_reduced
        daily_tests: *daily_reduced
        fips: []
        # Don't test the update process for internal distros, they are not public anyway
        # TODO: switch back to *daily_reduced once ubuntu-22.04 is gone (CMK-35236)
        daily_update_tests:
            - "almalinux-10"
            - "debian-13"
            - "ubuntu-24.04"
            - "ubuntu-26.04"
            - "sles-16.0"
        weekly: [*common, *cma_distros]
        testbuild: []
    ultimatemt:
        release: [*common, *cma_distros]
        daily: [*common, *cma_distros]
        daily_tests: [*common]
        fips: []
        # Don't test the update process for internal distros, they are not public anyway
        # TODO: switch back to *common once ubuntu-22.04 is gone (CMK-35236)
        daily_update_tests:
            - "debian-12"
            - "debian-13"
            - "ubuntu-24.04"
            - "ubuntu-26.04"
            - "almalinux-8"
            - "almalinux-9"
            - "almalinux-10"
            - "sles-15sp7"
            - "sles-16.0"
        weekly: [*common, *cma_distros]
        testbuild: []
    community:
        release: *common
        daily: *daily_reduced
        daily_tests: *daily_reduced
        fips: []
        # Don't test the update process for internal distros, they are not public anyway
        # TODO: switch back to *daily_reduced once ubuntu-22.04 is gone (CMK-35236)
        daily_update_tests:
            - "almalinux-10"
            - "debian-13"
            - "ubuntu-24.04"
            - "ubuntu-26.04"
            - "sles-16.0"
        weekly: *common
        testbuild: []
    cloud:
        release: *daily_saas
        daily: *daily_saas
        daily_tests: *daily_saas
        daily_update_tests: [*daily_saas]
        fips: []
        weekly: *daily_saas
        testbuild: []

# TODO: Sync this with our omd/distros/*.mk files
# We currently only need this for the internal_distros as at the point in the pipeline,
# where we want to exclude the internal distros, we are only using the distro codes and not the
# distro name anymore.
distro_to_codename:
    "ubuntu-22.04": "jammy"
