# Not yet clean:
# azure_v2 — Edition, HostAddress
# datadog — bypasses APIs to talk to the EC
# jolokia — import hack, resolve by migrating the bakery plugin
# metric_backend — cmk.metric_backend, cmk.utils.paths
# otel
# vnx_quotas — TODO: make the authorized keys configurable?

# Plugin families that refuse to play by the rules.

[plugin_families.violations.azure_v2_extended]
allows = [
  # reuse of the free azure_v2 plugin library (agent_based + rulesets helpers)
  "cmk.plugins.azure_v2",
  # StringAutocompleter for the otel_azure_metrics ruleset's metric-name field
  "cmk.gui.form_specs.unstable",
]


[plugin_families.violations.bakery]
# One of the first modes to go into the expected namespace
allows = [
  "@ccc",
  "cmk.base.modes.modes",
  "cmk.utils.log.console",
  "cmk.utils.render",
  "cmk.bakery",
]


[plugin_families.violations.crash]
