[plugin_families.violations.diagnostics]
allows = [
  "@livestatus_client",
  "cmk.ccc.hostaddress",
  "cmk.ccc.site",
  "cmk.ccc.store",
  "cmk.ccc.version_info",
]

# These plugins are tightly coupled to Checkmk.
# We cannot expect them to not depend on the core product.
[plugin_families.violations.checkmk]
allows = [
  "@livestatus_client",
  "cmk.base",
  "cmk.bi",
  "cmk.ccc",
  "cmk.checkengine",
  "cmk.checkengine.fetchers",
