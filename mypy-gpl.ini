# NOTE: Keep this is sync with the tool.mypy sections of pyproject.toml!
[mypy]
explicit_package_bases = true
mypy_path = $MYPY_CONFIG_FILE_DIR/omd/packages/omd:$MYPY_CONFIG_FILE_DIR/tests/typeshed
plugins = pydantic.mypy
python_version = 3.13
scripts_are_modules = true

# do not descend into 3rd party dependencies
follow_imports = silent
follow_imports_for_stubs = true

# hidden flags for PEP 688 compat, see https://github.com/python/mypy/issues/15313
disable_bytearray_promotion = true
disable_memoryview_promotion = true

# checks enabled via --strict
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_bytes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

# additional checks not enabled via --strict
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = false       # lots of findings all over the place
disallow_any_unimported = false # lots of findings all over the place
strict_equality_for_none = true
warn_unreachable = true

# error codes which are not enabled by default
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  # "explicit-override",   # lots of findings all over the place
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
  "unused-ignore",
  ]

# We should really get rid of these...
deprecated_calls_exclude = argparse.FileType, os.popen, os.system

# Do not complain about explicit Anys in generated shared_typing code (perhaps we should reconsider this)
[cmk.shared_typing.*]
disallow_any_explicit = false

# meraki has no type annotations; with explicit_package_bases=true and mypy 1.19+, following it
# silently triggers "Source file found twice under different module names". Skip it entirely —
# all meraki types remain Any either way since the package ships no py.typed or stubs.
[mypy-meraki,meraki.*]
follow_imports = skip
