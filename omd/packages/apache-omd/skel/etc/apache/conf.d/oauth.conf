# CORS support for the GUI-served OAuth authorization server endpoints
# (discovery, token, dynamic client registration) in cmk.gui.oauth. These
# pages are a standing part of the site, independent of any feature toggle,
# so their CORS/preflight exemption is always shipped here rather than tied
# to a hook -- unlike mcp.conf, which the MCP_SERVER hook writes only while
# the MCP server is enabled.
#
# Browser-based OAuth clients (MCP Inspector, web IDEs) send CORS preflights,
# so OPTIONS must reach these endpoints rather than hit the Apache-wide
# OPTIONS block in security.conf. oauth.conf sorts before security.conf under
# conf.d/*.conf, so this [L] short-circuits its OPTIONS->405 rewrite.
#
# oauth_authorize.py is deliberately NOT exempted (top-level navigation,
# never preflights). The RFC 8414 authorization-server well-known path arrives
# here as /<site>/check_mk/oauth_authorization_server.py (rewritten by the
# system apache, see omdlib.system_apache), so it is matched under that name.
# The MCP endpoint and the RFC 9728 protected-resource well-known path have
# their own CORS/preflight handling in mcp.conf: the MCP server sends its own
# CORS headers, and doubling them up would make browsers reject the response.
<IfModule mod_rewrite.c>
  RewriteEngine on
  RewriteCond %{REQUEST_METHOD} =OPTIONS
  RewriteCond %{REQUEST_URI} ^/[^/]+/check_mk/oauth_(authorization_server|token|client_registration)\.py$
  RewriteRule .* - [L]
</IfModule>

<IfModule mod_headers.c>
  <LocationMatch "^/[^/]+/check_mk/oauth_(authorization_server|token|client_registration)\.py$">
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Mcp-Protocol-Version"
  </LocationMatch>
</IfModule>
