# This file contains some common security settings we apply to the site apache
# and the requests to it. Please let us know in case these settings limit you
# in valid use cases.

# Mitigate the risk of cross-site scripting and other injection attacks.
#
# To make things easier, you can use an online CSP header generator
# such as: https://www.cspisawesome.com/.
#
# https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
# https://www.w3.org/TR/CSP3/
# https://content-security-policy.com/
# https://www.html5rocks.com/en/tutorials/security/content-security-policy/
#
<IfModule mod_headers.c>
    # The Checkmk GUI (Python) sets the Content-Security-Policy for its pages
    # (CMK-31353). For content served directly by Apache (NagVis, static HTML),
    # setifempty applies the legacy policy as a fallback - only when the GUI has
    # not set one. Keep in sync with the GUI's legacy policy.
    Header setifempty Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' ssh: rdp:; img-src 'self' data: https://*.tile.openstreetmap.org/; connect-src 'self' https://crash.checkmk.com/; frame-ancestors 'self'; base-uri 'self'; form-action 'self' javascript: 'unsafe-inline'; object-src 'self'; worker-src 'self' blob:"

    # A Content-Security-Policy is only meaningful for documents, not for static
    # assets like scripts, styles and images.
    <FilesMatch "\.(js|css|png|ico|wav|jpg)$">
        Header unset Content-Security-Policy
    </FilesMatch>

    # Disable all Features
    # See:
    #   * https://wiki.owasp.org/index.php/OWASP_Secure_Headers_Project#fp
    #   * https://w3c.github.io/webappsec-permissions-policy/
    Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=()"

    Header always set X-Frame-Options "sameorigin"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always set Referrer-Policy "origin-when-cross-origin"

    # Don't allow the browser to change the content type we send to him. See CMK-6239.
    Header always set X-Content-Type-Options "nosniff"
</IfModule>

# Provide minimal information about the running software version and platform to clients
ServerTokens Prod

# Disable TRACE request method to prevent some kind of reflection attack
TraceEnable Off

# Disable all methods except the used methods. Add more if needed.
<IfModule mod_rewrite.c>
  RewriteEngine on
  RewriteCond %{REQUEST_METHOD} !^(HEAD|GET|POST|DELETE|PUT|PATCH)
  RewriteRule .* - [R=405,L]
</IfModule>
