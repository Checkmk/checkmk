# Checkmk Maps Apache configuration.
#
# The backend daemon serves only live state (REST + SSE) over a Unix socket under
# tmp/run. The SPA is NOT served here: it ships in cmk-frontend-vue's bundle and
# mounts as the <cmk-maps> web component on the GUI page maps.py.

# No auth directive needed: /<site>/check_mk is already exempt from the site's
# Basic-auth realm via omdlib's cookie-auth rule (^/<site>/(nagvis|check_mk) with
# Satisfy any), so /check_mk/maps inherits it. The daemon authenticates requests
# itself by validating the signed ticket the cookie-authed GUI session minted.

# Named 00_maps.conf to be Included BEFORE check_mk.conf: mod_alias uses the first
# matching Alias, and check_mk.conf ships a broad `Alias /<site>/check_mk`, so our
# /check_mk/maps rules must register first or fall through to htdocs (404).

# The site apache ships a minimal module set without the proxy modules (the system
# apache proxies the site), so Maps — the only site-apache proxy consumer — loads
# them here. Guarded like the base conf's mpm/unixd loads to avoid a double-load.
<IfModule !mod_proxy.c>
  LoadModule proxy_module ###ROOT###/lib/apache/modules/mod_proxy.so
</IfModule>
<IfModule !mod_proxy_http.c>
  LoadModule proxy_http_module ###ROOT###/lib/apache/modules/mod_proxy_http.so
</IfModule>

<IfModule mod_proxy_http.c>
  # flushpackets=on: SSE needs unbuffered streaming.
  # retry=0: never park the worker in the default 60s error state, so /maps/api
  #   recovers immediately after an `omd restart maps` gap instead of 503-ing.
  # timeout=3600: SSE streams idle far past the site apache's `Timeout 120`.
  ProxyPass /###SITE###/check_mk/maps/api unix:###ROOT###/tmp/run/maps.sock|http://localhost/api flushpackets=on retry=0 timeout=3600
  ProxyPassReverse /###SITE###/check_mk/maps/api http://localhost/api
</IfModule>

# Image library + map backgrounds are plain files (owned by cmk.maps.gui._images)
# served statically under the Basic-auth-exempt prefix: icons are a non-sensitive
# shared library, and each background's filename carries an unguessable token, so
# the URL is a capability rather than an enumerable path.
Alias /###SITE###/check_mk/maps/images ###ROOT###/var/maps/images
Alias /###SITE###/check_mk/maps/maps/backgrounds ###ROOT###/var/maps/maps/backgrounds

# Uploaded SVGs are stored verbatim and served as image/svg+xml from the site's
# own origin, so navigating straight to one makes it a document. Without this the
# site-wide fallback policy applies, which carries 'unsafe-inline' — and the
# upload-time SVG sandbox (cmk.maps.gui._image_security) would be the only thing
# standing between a filter gap and script execution in the session's origin.
# Overriding it here costs nothing: these responses are images, not documents,
# and <img>/CSS embedding ignores a document CSP.
<Directory ###ROOT###/var/maps/images>
  Options -Indexes
  Require all granted
  <IfModule mod_headers.c>
    Header set Content-Security-Policy "default-src 'none'; sandbox"
  </IfModule>
</Directory>
<Directory ###ROOT###/var/maps/maps/backgrounds>
  Options -Indexes
  Require all granted
  <IfModule mod_headers.c>
    Header set Content-Security-Policy "default-src 'none'; sandbox"
  </IfModule>
</Directory>
