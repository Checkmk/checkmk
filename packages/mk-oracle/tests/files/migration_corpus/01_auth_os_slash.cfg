# Auth dimension: "/" username means OS / wallet authentication. It must
# not migrate to standard auth with empty credentials, and no synthetic
# instance may be invented (CMK-37146, CMK-37339). OS authentication
# proper is not supported, so "/" stays wallet (CMK-37340).
DBUSER='/:::::'
ASMUSER='/::SYSASM:::'
SYNC_SECTIONS='instance sessions'
ASYNC_SECTIONS='tablespaces'
CACHE_MAXAGE=600
