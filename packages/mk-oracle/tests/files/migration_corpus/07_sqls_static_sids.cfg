# SQLS dimension: a custom SQL section with literal SQLS_SIDS must attach
# to the named instance as a custom metric, keeping SQLS_ITEM_NAME and the
# SQLS_DIR + SQLS_SQL path (CMK-34630 baseline).
DBUSER='user:pass::localhost:1521:'
SQLS_MAX_CACHE_AGE=300
SQLS_SECTIONS="tbl_check"
tbl_check () {
    SQLS_SIDS="PROD1"
    SQLS_DIR="/etc/check_mk"
    SQLS_SQL="tbl_check.sql"
    SQLS_ITEM_NAME="my_table_check"
}
