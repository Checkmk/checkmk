# SQLS dimension: SQLS_TNSALIAS next to a single literal SQLS_SIDS — both
# must be migrated (sid + alias on one instance entry), and the migrator
# must warn that the alias, not the SID, resolves the instance
# (CMK-37381, CMK-37458).
DBUSER='user:pass'
SQLS_SECTIONS="invalid_objects"
invalid_objects () {
    SQLS_TNSALIAS=PROD_ALIAS
    SQLS_SIDS=PRODDB
    SQLS_SQL=invalid_objects.sql
}
