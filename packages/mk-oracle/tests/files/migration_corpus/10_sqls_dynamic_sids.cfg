# SQLS dimension: SQLS_SIDS built by a shell expression cannot be migrated
# reliably. When it expands to nothing, the section must be dropped with a
# warning instead of becoming an unrestricted global custom metric
# (CMK-37380).
DBUSER='user:pass'
SQLS_SECTIONS="dyn"
dyn () {
    SQLS_SIDS=${ORACLE_SID:-$SIDS}
    SQLS_SQL="dyn.sql"
}
