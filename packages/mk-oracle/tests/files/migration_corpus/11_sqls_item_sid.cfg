# SQLS dimension: SQLS_ITEM_SID changes the legacy check item identity.
# The new plugin has no equivalent, so when it differs from the instance
# the section runs on, the migrator must warn about the changed service
# name while still migrating the section with its SQLS_ITEM_NAME
# (CMK-37379). Here the query runs on the CDB but the legacy item was
# reported under the PDB name.
DBUSER='user:pass'
SQLS_SECTIONS="foo_views_chk1"
foo_views_chk1 () {
    SQLS_SIDS="PRODCDB"
    SQLS_SQL="foo_view_check1.sql"
    SQLS_ITEM_NAME="foo_views_kim1"
    SQLS_ITEM_SID="PRODPDB1"
}
