# Formatting dimension: quirks seen in real-world configs in one file —
# `export` prefix, double quotes instead of single quotes, unquoted
# values, indented assignments and blank lines. All values must still be
# extracted (formatting-quirk class of CMK-38008).
export TNS_ADMIN=/etc/check_mk

DBUSER="quoted_user:quoted_pw::localhost:1521:"

    CACHE_MAXAGE=740
MAX_TASKS=3
OLRLOC=/etc/oracle/olr.loc
