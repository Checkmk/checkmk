# SQLS dimension: SQLS_PARAMETERS (SQL*Plus DEFINE statements etc.) has
# no equivalent in the new plugin; the custom metric is migrated without
# it and a warning asks for a manual conversion to sql_params
# (CMK-37382).
DBUSER='user:pass'
SQLS_SECTIONS="param_check"
param_check () {
    SQLS_SIDS="PROD1"
    SQLS_SQL="param_check.sql"
    SQLS_PARAMETERS="DEFINE warn_level = 10"
}
