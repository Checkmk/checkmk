# Discovery dimension: ONLY_SIDS/SKIP_SIDS drive instance discovery and
# a per-SID section list EXCLUDE_<SID>='<sections>' must migrate to
# excluded_sections instead of being silently dropped (CMK-37456).
# NOTE: EXCLUDE_<SID>=ALL (exclude the whole instance) is currently
# dropped by the migrator — "not supported yet" per migration.rs; it no
# longer reaches discovery.exclude either.
DBUSER='user:pass::localhost:1521:'
SYNC_SECTIONS='instance sessions'
ASYNC_SECTIONS='jobs'
ONLY_SIDS='XE1 XE2 XE3'
SKIP_SIDS='XE3'
EXCLUDE_XE1=ALL
EXCLUDE_XE2='jobs sessions'
