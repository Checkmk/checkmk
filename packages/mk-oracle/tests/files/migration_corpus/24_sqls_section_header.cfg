# SQLS dimension: SQLS_SECTION_NAME and SQLS_SECTION_SEP override the
# section header of a custom SQL; they migrate to header_name and to
# header_sep as ASCII code (CMK-37307).
DBUSER='user:pass::localhost:1521:'
SQLS_SECTIONS="hdr_check"
hdr_check () {
    SQLS_SIDS="PROD1"
    SQLS_SQL="hdr_check.sql"
    SQLS_SECTION_NAME="my_section"
    SQLS_SECTION_SEP="124"
}
